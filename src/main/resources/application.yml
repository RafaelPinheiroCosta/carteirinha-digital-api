spring:
  application:
    name: carteirinha-digital-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:carteirinha;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  # Credenciais didáticas somente para desenvolvimento local.
  # Não utilizar esta senha em ambientes públicos ou de produção.
  # Variáveis de ambiente APP_BOOTSTRAP_ADMIN_LOGIN e
  # APP_BOOTSTRAP_ADMIN_PASSWORD têm precedência quando definidas.
  bootstrap:
    admin-login: ${APP_BOOTSTRAP_ADMIN_LOGIN:admin-local}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:AdminLocal123!}
  jwt:
    issuer: carteirinha-digital-api
    # Chave didática. Em produção, defina JWT_SECRET no ambiente.
    secret: ${JWT_SECRET:chave-didatica-local-com-mais-de-32-caracteres-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
